<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SKIMMS Kavach</title>
<link rel=manifest href=manifest.json><meta name=theme-color content=#07090c><link rel=stylesheet href=https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css>
<style>:root{--p:rgba(14,18,24,.86);--l:#2a3440;--t:#e4eaf0;--d:#8793a0;--y:#f2b01e;box-sizing:border-box;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}*{box-sizing:inherit}
body{margin:0;background:#07090c;color:var(--t);font:14px system-ui,sans-serif}#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
.w{max-width:1100px;margin:auto;padding:12px;display:grid;gap:12px}.c{background:var(--p);border:1px solid var(--l);border-radius:10px;padding:14px;backdrop-filter:blur(4px)}
input,button{font:inherit;padding:10px 12px;border-radius:6px;border:1px solid var(--l);background:#151c25;color:var(--t)}button{cursor:pointer}.pri{background:var(--y);color:#111;font-weight:700;border-color:var(--y)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.b{padding:3px 10px;border-radius:12px;font:700 12px monospace;color:#000}.s{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.s div{background:#151c25;padding:8px;border-radius:6px}.s small,small{color:var(--d)}.s small{display:block}
#map{height:300px;border-radius:8px;display:grid;place-items:center;color:var(--d)}.al{border-left:4px solid;padding:6px 10px;margin:6px 0;background:#151c25}.big{font-size:32px;font-weight:800;text-align:center;padding:24px;border-radius:14px;color:#000}.n{font-size:28px;font-weight:700}
.sos{background:#c0262c;border-color:#c0262c;font-size:18px;font-weight:800;padding:18px;width:100%}.tab{flex:1}.tab.on{border-color:var(--y);color:var(--y)}</style></head><body><canvas id=bg></canvas><div id=app></div>
<script src=https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js></script><script>
// ---- animated mining tunnel: receding timber frames, rails, lamp flicker, floating dust ----
(()=>{const c=$('#bg'),x=c.getContext('2d'),still=matchMedia('(prefers-reduced-motion:reduce)').matches;let W,H,t=0;const D=Array.from({length:80},()=>({x:Math.random(),y:Math.random(),z:Math.random()*.8+.2}));
const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight};rs();addEventListener('resize',rs);
(function f(){if(!still)t++;x.fillStyle='#07090c';x.fillRect(0,0,W,H);const cx=W/2,cy=H*.42;
 const fl=.16+.03*Math.sin(t*.07)+.015*Math.sin(t*.33),g=x.createRadialGradient(cx,cy,10,cx,cy,Math.max(W,H)*.6);g.addColorStop(0,`rgba(255,190,70,${fl})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
 for(let i=0;i<10;i++){const k=((i*72+t*1.1)%720)/720,s=Math.pow(k,2.2)*1.5+.02,w=W*s,h=H*s*.85;x.strokeStyle=`rgba(130,85,32,${.06+k*.3})`;x.lineWidth=2+k*9;x.strokeRect(cx-w/2,cy-h/2,w,h)}
 x.strokeStyle='rgba(120,130,140,.22)';x.lineWidth=2;for(const sx of[-.12,.12]){x.beginPath();x.moveTo(cx+sx*W*.05,cy+H*.04);x.lineTo(cx+sx*W*3,H);x.stroke()}
 for(const d of D){d.y-=.0004*d.z;d.x+=Math.sin(t*.01+d.z*9)*.0003;if(d.y<0){d.y=1;d.x=Math.random()}x.fillStyle=`rgba(255,220,160,${.12*d.z})`;x.beginPath();x.arc(d.x*W,d.y*H,d.z*1.6,0,7);x.fill()}
 requestAnimationFrame(f)})()})();
function $(s){return document.querySelector(s)}
const COL={SAFE:'#2fbf71',CAUTION:'#f2a93b',DANGER:'#e5484d',CRITICAL:'#ff3b9a',OFFLINE:'#5b6672'},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOK=localStorage.tok,ROLE=localStorage.role,FL={},AL=[],ME=null,map=null,mk={},ws;
const api=async(p,o={})=>{const r=await fetch('/api/'+p,{method:o.method||(o.body?'POST':'GET'),headers:{'content-type':'application/json',authorization:'Bearer '+(TOK||'')},body:o.body&&JSON.stringify(o.body)});let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||r.status);return j};
const out=()=>{localStorage.clear();location.reload()};
function login(err='',tab='worker'){$('#app').innerHTML=`<div class=c style="max-width:400px;margin:5vh auto;display:grid;gap:10px;text-align:center"><div style=font-size:44px>⛑️</div><h2 style=margin:0>SKIMMS</h2><small style=color:var(--y)>Smart Kavach for Intelligent Mine Monitoring</small><small>Team HEXACREW · University of Calcutta · SIH26039</small>
<div class=row style=gap:6px><button class="tab ${tab=='worker'?'on':''}" onclick="login('','worker')">Worker View</button><button class="tab ${tab=='admin'?'on':''}" onclick="login('','admin')">Control Room</button></div>
${tab=='worker'?`<b>Miner Authentication</b><input id=i placeholder="ESP32 Node ID e.g. ESP32_NODE_01"><input id=p type=password inputmode=numeric maxlength=4 placeholder="Worker 4-digit PIN"><button class=pri onclick="go('worker')">Enter Mine Station</button>`:`<b>Control Room Supervisor</b><input id=u value=admin><input id=p type=password placeholder="Supervisor password"><button class=pri onclick="go('admin')">Enter Control Room</button>`}<div style=color:#e5484d>${esc(err)}</div></div>`}
async function go(role){try{const j=await api(role+'/login',{body:role=='worker'?{esp32_id:$('#i').value.trim(),pin:$('#p').value}:{username:$('#u').value,password:$('#p').value}});TOK=j.token;ROLE=role;localStorage.tok=TOK;localStorage.role=role;boot()}catch(e){login(e.message,role)}}
async function boot(){try{if(ROLE=='admin'){const f=await api('admin/fleet');FL={};f.forEach(w=>FL[w.esp32_id]=w);AL=await api('alerts');adminUI()}else{ME=await api('worker/status');AL=await api('alerts');workerUI()}}catch{return out()}paint();live()}
function live(){ws=new WebSocket((location.protocol=='https:'?'wss':'ws')+'://'+location.host+'/ws?token='+encodeURIComponent(TOK));
 ws.onmessage=e=>{const m=JSON.parse(e.data),rep=a=>{const i=AL.findIndex(x=>x.id==a.id);i>=0?AL[i]=a:AL.unshift(a)};
  if(m.type=='TELEMETRY_UPDATE'){if(ROLE=='admin'){if(FL[m.esp32_id])FL[m.esp32_id].telemetry=m.telemetry}else ME.telemetry=m.telemetry}
  else if(m.type=='ALERT_TRIGGERED'){AL.unshift(m.alert);navigator.vibrate&&navigator.vibrate([300,100,300])}else if(m.type=='ALERT_ACKNOWLEDGED'||m.type=='ALERT_ESCALATED')rep(m.alert);
  else if(m.type=='WORKER_REGISTERED'&&ROLE=='admin')FL[m.worker.esp32_id]={...m.worker,telemetry:null};
  else if(m.type=='WORKER_DELETED'){delete FL[m.esp32_id];if(mk[m.esp32_id]){mk[m.esp32_id].remove();delete mk[m.esp32_id]}}paint()};
 ws.onclose=ev=>{if(ev.code==4401)out();else setTimeout(live,3000)}}
const st=t=>t&&Date.now()-t.last_seen<15000?t.ai_evaluation.status:(t&&t.lost?'DANGER':'OFFLINE');
const tiles=t=>{const s=t.sensors;return`<div class=s><div><small>MQ-4 methane</small>${s.mq4}</div><div><small>MQ-135 air</small>${s.mq135}</div><div><small>Accel m/s²</small>${s.accel}</div><div><small>Pulse IR</small>${s.ir}</div>${t.battery!=null?`<div><small>Battery</small>${t.battery}%</div>`:''}</div>`};
function adminUI(){$('#app').innerHTML=`<div class=w><div class="c row"><b>⛑ SKIMMS · Control Room</b><span><button onclick=csv()>Alerts CSV</button> <button onclick=bk()>Backup workers</button> <button onclick=out()>Logout</button></span></div><div class=g id=sts></div>
<details class=c><summary><b>+ Register helmet</b></summary><div class=g style=margin-top:8px><input id=e placeholder="ESP32 ID e.g. ESP32_NODE_01"><input id=h placeholder="Helmet tag e.g. HLM-042"><input id=n placeholder="Miner full name"><input id=pn inputmode=numeric maxlength=4 placeholder="4-digit login PIN"><input id=ar placeholder="Assigned area e.g. Sector 3 - Face B"></div><div class=row style=margin-top:8px><button onclick="this.closest('details').open=false">Cancel</button><button class=pri onclick=reg()>Create Key &amp; Save</button></div><div id=msg style=margin-top:8px></div></details>
<div class=c><div id=map></div></div><div class=g id=cards></div><div class=c><b>Alerts</b><div id=al></div></div></div>`;
 try{map=L.map('map').setView([22.5726,88.3639],15);L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd'}).addTo(map)}catch{map=null;$('#map').textContent='Map unavailable (offline or blocked) - live data still works'}}
async function reg(){try{const j=await api('admin/workers',{body:{esp32_id:$('#e').value.trim(),helmet_number:$('#h').value.trim(),worker_name:$('#n').value.trim(),worker_pin:$('#pn').value,area:$('#ar').value.trim()}});
 $('#msg').innerHTML=`Saved. Flash into helmet: <code>board_id="${esc(j.worker.esp32_id)}" x-device-key="${esc(j.worker.device_key)}"</code> (shown once)`;FL[j.worker.esp32_id]={...j.worker,telemetry:null};delete FL[j.worker.esp32_id].device_key;paint()}catch(e){$('#msg').textContent=e.message}}
const ack=id=>api('alerts/'+id+'/ack',{method:'POST'}).catch(e=>alert(e.message));
const rot=async id=>{if(confirm('New key? The old key stops working now.')){const j=await api('admin/workers/'+id+'/rotate-key',{method:'POST'});prompt('New x-device-key (copy into helmet firmware):',j.new_device_key)}};
const del=async id=>{if(confirm('Remove '+id+'?'))await api('admin/workers/'+id,{method:'DELETE'})};
const csv=async()=>{const r=await fetch('/api/alerts/export-csv',{headers:{authorization:'Bearer '+TOK}}),a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download='skimms_alerts.csv';a.click()};
const bk=async()=>{const j=JSON.stringify(await api('admin/export'));try{await navigator.clipboard.writeText(j);alert('Copied. On your host: Environment > WORKERS_JSON > paste > save.')}catch{prompt('Copy into WORKERS_JSON:',j)}};
const alerts=a=>AL.slice(0,20).map(x=>`<div class=al style=border-color:${COL[x.status]}><b>${x.status}</b> · ${esc(x.worker_name)} (${esc(x.helmet_number)}) · ${new Date(x.timestamp).toLocaleTimeString()}<br>${x.reasons.map(esc).join('; ')}${x.acknowledged?' · ✔ acknowledged':x.escalated?' · ⚠ ESCALATED':''}${a&&!x.acknowledged?` <button onclick="ack('${x.id}')">Acknowledge</button>`:''}</div>`).join('')||'No alerts';
function paint(){if(ROLE=='admin'&&$('#cards')){const F=Object.values(FL);
  $('#sts').innerHTML=[['Helmets',F.length],['Online',F.filter(f=>st(f.telemetry)!='OFFLINE').length],['Open alerts',AL.filter(a=>!a.acknowledged).length]].map(([k,v])=>`<div class=c><small>${k}</small><div class=n>${v}</div></div>`).join('');
  $('#cards').innerHTML=F.map(w=>{const t=w.telemetry,s=st(t),c=COL[s];if(map&&t&&t.gps.valid){const p=[t.gps.lat,t.gps.lng];mk[w.esp32_id]?mk[w.esp32_id].setLatLng(p).setStyle({color:c}):mk[w.esp32_id]=L.circleMarker(p,{radius:9,color:c}).addTo(map).bindTooltip(esc(w.worker_name))}
   return`<div class=c style="border-top:4px solid ${c}"><div class=row><b>${esc(w.worker_name)}</b><span class=b style=background:${c}>${s}</span></div><small>${esc(w.helmet_number)} · ${esc(w.esp32_id)} · ${esc(w.area)}</small>${t?tiles(t)+`<div style=margin-top:6px>${t.ai_evaluation.reasons.map(esc).join('<br>')}</div>`:''}<div class=row style=margin-top:8px><button onclick="rot('${esc(w.esp32_id)}')">New key</button><button onclick="del('${esc(w.esp32_id)}')">Remove</button></div></div>`}).join('');$('#al').innerHTML=alerts(true)}
 else if(ROLE=='worker'&&$('#st')){const t=ME.telemetry,s=st(t);$('#st').innerHTML=`<div class=big style=background:${COL[s]}>${s}<div style=font-size:13px;font-weight:600>${esc(ME.worker.helmet_number)} · ${esc(ME.worker.esp32_id)}${t?' · risk '+t.ai_evaluation.risk_score+'%':''}</div></div>`;
  $('#sn').innerHTML=t?tiles(t)+`<small>GPS ${t.gps.valid?t.gps.lat.toFixed(5)+', '+t.gps.lng.toFixed(5):'no fix'}</small><div style=margin-top:6px>${t.ai_evaluation.reasons.map(esc).join('<br>')}</div>`:'Waiting for helmet…';$('#al').innerHTML=alerts(false)}}
function workerUI(){$('#app').innerHTML=`<div class=w><div class="c row"><span><b>${esc(ME.worker.worker_name)}</b><br><small>${esc(ME.worker.area)}</small></span><button onclick=out()>Logout</button></div><div id=st></div><div class=c id=sn></div><button class=sos onclick="sos()">🆘 EMERGENCY SOS</button><div class=c><b>My alerts</b><div id=al></div></div></div>`}
const sos=async()=>{if(!confirm('Send emergency SOS to the control room?'))return;try{await api('worker/sos',{method:'POST'});navigator.vibrate&&navigator.vibrate(500);alert('SOS sent')}catch(e){alert(e.message)}};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');setInterval(paint,3000);TOK&&ROLE?boot():login();
</script><iframe id=intro src=helmet.html title="SKIMMS intro" style="position:fixed;inset:0;width:100%;height:100%;border:0;z-index:9999;background:#05080c"></iframe>
<script>(function(){var f=document.getElementById('intro');try{if(sessionStorage.getItem('skimms_intro')){f.remove();return}}catch(e){}
addEventListener('message',function(e){if(e.origin!==location.origin||!e.data||e.data.type!=='skimms-enter')return;try{sessionStorage.setItem('skimms_intro','1')}catch(x){}f.style.transition='opacity .6s';f.style.opacity=0;setTimeout(function(){f.remove()},650)})})();</script>
</body></html>
